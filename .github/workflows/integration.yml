name: Integration

on:
  push:
    branches:
      - "**"
  # Allows manually triggering on main to setup caches for existing PRs
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache clang-format-21
        id: cache-clang-format
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-21
          key: clang-format-21-${{ runner.os }}

      - name: Install clang-format-21
        if: steps.cache-clang-format.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-21

      - name: Add clang-format-21 to PATH
        run: echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Formatting Checks
        run: find source tests -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) | xargs clang-format-21 -n -Werror --verbose

  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.*"
          cache: true
          install-deps: true

      - name: Run Tests
        env:
          # Headless mode
          QT_QPA_PLATFORM: offscreen
        run: make test

  emscripten-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-5.0.0

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 5.0.0
          ~/emsdk/emsdk activate 5.0.0

      - name: Activate Emscripten
        run: |
          source ~/emsdk/emsdk_env.sh
          echo "EMSDK=$HOME/emsdk" >> $GITHUB_ENV
          echo "$HOME/emsdk/upstream/emscripten" >> $GITHUB_PATH

      - name: Run Tests
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          BUILD_DIR: /tmp/build
        run: bash scripts/docker-entrypoint.sh test-emscripten
