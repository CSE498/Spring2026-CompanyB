name: Integration

on:
  # Run on all PRs to main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Formatting Checks
        run: find source tests -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) | xargs clang-format --style="Google" -n -Werror --verbose

  test:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-5.0.0

      - name: Cache SDL Port
        uses: actions/cache@v4
        with:
          path: ~/emsdk/upstream/emscripten/cache/sysroot
          key: sdl-port-${{ runner.os }}-sdl${{ env.SDL_VERSION }}-emsdk5.0.0

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 5.0.0
          ~/emsdk/emsdk activate 5.0.0

      - name: Activate Emscripten
        run: |
          source ~/emsdk/emsdk_env.sh
          echo "EMSDK=$HOME/emsdk" >> $GITHUB_ENV
          echo "$HOME/emsdk/upstream/emscripten" >> $GITHUB_PATH
          emcc --use-port=sdl${SDL_VERSION} --check

      - name: Run Tests
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          BUILD_DIR: /tmp/build
        run: bash scripts/docker-entrypoint.sh test
