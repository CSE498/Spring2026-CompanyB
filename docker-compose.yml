services:
  # Build with Emscripten
  build-emscripten:
    build:
      context: .
    volumes:
      - ./source:/app/source:ro
      - ./demo:/app/demo:ro
      - ./build:/app/build
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-}
      - CMAKE_EXTRA_FLAGS=${CMAKE_EXTRA_FLAGS:-}
      - TARGET_MAIN=${TARGET_MAIN:-}
    command: build-emscripten

  # Build natively with Qt
  build-native:
    build:
      context: .
    volumes:
      - ./source:/app/source:ro
      - ./demo:/app/demo:ro
      - ./build:/app/build
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-}
      - CMAKE_EXTRA_FLAGS=${CMAKE_EXTRA_FLAGS:-}
      - NO_QT=${NO_QT:-0}
      - TARGET_MAIN=${TARGET_MAIN:-}
    command: build-native

  # Build and run emscripten tests
  test-emscripten:
    build:
      context: .
    volumes:
      - ./source:/app/source:ro
      - ./third-party:/app/third-party:ro
      - ./build:/app/build
      - ./tests:/app/tests:ro
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
    command: test-emscripten

  # Build and run native tests
  test-native:
    build:
      context: .
    volumes:
      - ./source:/app/source:ro
      - ./build:/app/build
      - ./tests:/app/tests:ro
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - NO_QT=${NO_QT:-0}
    command: test-native

  # Build and serve with emrun web server
  serve:
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - ./source:/app/source:ro
      - ./demo:/app/demo:ro
      - ./build:/app/build
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - SERVE_PORT=8080
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-}
      - CMAKE_EXTRA_FLAGS=${CMAKE_EXTRA_FLAGS:-}
      - TARGET_MAIN=${TARGET_MAIN:-}
    command: serve

  # Interactive development shell
  dev:
    build:
      context: .
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    volumes:
      - ./source:/app/source
      - ./demo:/app/demo
      - ./build:/app/build
      - ./scripts/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
    environment:
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE:-}
      - CMAKE_EXTRA_FLAGS=${CMAKE_EXTRA_FLAGS:-}
      - NO_QT=${NO_QT:-0}
      - TARGET_MAIN=${TARGET_MAIN:-}
    working_dir: /app
    command: shell

  # Run the native Qt binary
  run-native:
    build:
      context: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: /app/build/docker-native/app
    volumes:
      - ./build:/app/build
      - ./assets:/app/assets:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/tmp/xdg-runtime
      - QT_QPA_PLATFORM=${QT_QPA_PLATFORM:-xcb}
      - PULSE_SERVER=${PULSE_SERVER:-}
